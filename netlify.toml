[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Oude Kirby-adressen
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/panel/*"
  to = "/"
  status = 301

# Foto-adressen van Kirby (/media/pages/<pagina>/...) → de pagina zelf
[[redirects]]
  from = "/media/pages/home/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/media/pages/:pagina/*"
  to = "/:pagina"
  status = 301

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex"
